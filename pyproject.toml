[project]
name = "qata-server"
version = "0.1.0"
description = "qata の server"
authors = [
    { name = "Masakazu2025", email = "miz.masakazu87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "referencing>=0.37.0",
    "rfc3339-validator>=0.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/qata_server/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[project.scripts]
qata-server = "qata_server.main:serve"
qata-server-mcp = "qata_server.main:serve_mcp"

[tool.importlinter]
root_package = "qata_server"

[[tool.importlinter.contracts]]
name = "依存は上から下へ：組み立て → 入口（REST・MCP）・runner への道具 → application → 契約の型"
type = "layers"
layers = [
    "qata_server.main",
    "qata_server.rest | qata_server.mcp_server | qata_server.runner_http",
    "qata_server.application",
    "qata_server.contracts",
]
